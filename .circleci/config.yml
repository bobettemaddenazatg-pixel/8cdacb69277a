      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load blade model
          command: |
            printf 'guard 1\n' > quill.cfg
      - run:
          name: Build forge sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Quillon -j2
      - run:
          name: Temper quillon guard
